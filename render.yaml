services:
  - type: web
    name: cs3720-activity08-echo
    runtime: python
    plan: free
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    startCommand: uvicorn server_echo:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: “3.14”
    healthCheckPath: /

  - type: web
    name: cs3720-activity08-chat
    runtime: python
    plan: free
    buildCommand: 
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: “3.14”
    healthCheckPath: /







